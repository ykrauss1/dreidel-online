# Keeps the free Supabase project awake: Supabase pauses a free project after ~7 days without
# database activity, and the game's live messages (Realtime) don't count as such. This reads one
# row from the tiny public "keepalive" table every two days.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
# GitHub switches a scheduled job off by itself after 60 days with no activity in the repository -
# and this game sleeps from one Hanukkah to the next. With the job off, Supabase would pause the
# project a week later and the online game would be dead when it is opened again. The first step
# below re-enables this workflow on every run, which restarts those 60 days.
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep this schedule from being switched off
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-keepalive.yml/enable"
      - name: Read the keepalive row
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            "https://vhcxfrrafpqhvmmunoxp.supabase.co/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: sb_publishable_4RWou7vJ8GdNXukaXduu5g_jd1LpyXN")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          test "$code" = "200"
